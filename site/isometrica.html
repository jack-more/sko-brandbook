<meta charset="utf-8"><title>Isometrica — SKO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"><link rel="stylesheet" href="site.css?v=41"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* the module: one snow world, frames crossfade, the molecule and the vial arrive separately, the name sets last */
.iso{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--navy);overflow:hidden}
.iso.square{aspect-ratio:1;max-width:min(100%,78vh);margin:0 auto}
.iso .frame{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.iso .frame.on{opacity:1}
.iso .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.iso .frame .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,11,119,.0),rgba(2,11,119,.0) 62%,rgba(2,11,119,.35));opacity:0;transition:opacity 1.1s}
.iso .frame.on .veil{opacity:1}
.iso .cap{position:absolute;left:clamp(18px,4vw,56px);bottom:clamp(18px,4vw,56px);color:#fff;transform:translateY(24px);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1) .5s,opacity .9s .5s}
.iso .frame.on .cap{transform:none;opacity:1}
.iso .cap .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--frost)}
.iso .cap h2{font-family:Syncopate,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(18px,3vw,44px);line-height:1.05;margin-top:8px}
.iso .cap .d{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--frost);margin-top:8px}
.iso .sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.14) 50%,transparent 55%);transform:translateX(-130%);pointer-events:none}
.iso .frame.on .sweep{animation:isw 1.6s .2s ease-out forwards}
@keyframes isw{to{transform:translateX(130%)}}
.iso .ui{position:absolute;right:clamp(14px,3vw,40px);bottom:clamp(14px,3vw,40px);display:flex;gap:6px;align-items:center}
.iso .ui button{width:38px;height:38px;border:0;background:rgba(255,255,255,.92);color:var(--navy);font-size:16px;cursor:pointer}
.iso .dots{position:absolute;left:0;right:0;top:clamp(14px,3vw,40px);display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 20px}
.iso .dots i{width:14px;height:2px;background:rgba(255,255,255,.35)}
.iso .dots i.on{background:#fff}
.iso.square .cap h2{font-size:clamp(16px,4vw,28px)}
.tog{display:flex;gap:10px;justify-content:center;padding:14px}
.tog button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;font-family:Syncopate,sans-serif;font-weight:700;font-size:9px;text-transform:uppercase;cursor:pointer}
.tog button.on{background:var(--navy);color:#fff}
@media (prefers-reduced-motion:reduce){.iso .frame,.iso .cap,.iso .veil{transition:none}.iso .frame.on .sweep{animation:none}}
</style>
<nav class="wrap"><a href="index.html"><img src="../img/lockup-3x1-white.png" alt="SKO Compounds"></a><div class="lk"><a href="compounds.html">Compounds</a><a href="bundles.html">Bundles</a><a href="isometrica.html" class="on">Isometrica</a><a href="loyalty.html">The Badge</a><a href="lab.html">Lab</a><a class="keep" href="#">Cart</a></div></nav><div class="note">PREVIEW · ISOMETRICA · NOT LIVE</div>
<div class="tog"><button class="on" data-r="wide">16 : 9</button><button data-r="square">1 : 1</button></div>
<div class="iso" id="iso"><div class="dots" id="dots"></div><div class="ui"><button id="ip" aria-label="Previous">‹</button><button id="in" aria-label="Next">›</button></div></div>
<footer class="wrap"><div class="f"><div><div class="mono">ISOMETRICA · SKO COMPOUNDS</div><div class="disp big" style="margin-top:14px">Every compound,<br>as a machine.</div></div><div class="mono">RESEARCH USE ONLY · © 2026</div></div></footer>
<script>
(async function(){
  const [prods,man]=await Promise.all([fetch('../products.json?v='+Date.now()).then(r=>r.json()),fetch('manifest.json?v='+Date.now()).then(r=>r.json())]);
  const list=prods.filter(p=>(man[p.slug]||[]).includes('wide'));const hasSq=p=>(man[p.slug]||[]).includes('square');
  const iso=document.getElementById('iso'),dots=document.getElementById('dots');
  list.forEach((p,i)=>{const f=document.createElement('div');f.className='frame';f.innerHTML=`<img data-wide="../img/products/web/hd/${p.slug}-wide.jpg" data-square="../img/products/web/${hasSq(p)?p.slug+'-square':p.slug+'-wide'}.jpg" src="../img/products/web/hd/${p.slug}-wide.jpg" alt="${p.name}"><div class="veil"></div><div class="sweep"></div><div class="cap"><div class="k">ISOMETRICA · ${String(i+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}</div><h2>${p.name}</h2><div class="d">${p.spray?'NASAL SPRAY':'LYOPHILISED VIAL'} · 99% PURITY · RESEARCH USE ONLY</div></div>`;iso.appendChild(f);const d=document.createElement('i');dots.appendChild(d)});
  const frames=[...iso.querySelectorAll('.frame')],ds=[...dots.children];let cur=0,timer;
  function go(i){cur=(i+frames.length)%frames.length;frames.forEach((f,j)=>f.classList.toggle('on',j===cur));ds.forEach((d,j)=>d.classList.toggle('on',j===cur));const nx=frames[(cur+1)%frames.length].querySelector('img');nx.loading='eager'}
  function auto(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>go(cur+1),4200)}
  document.getElementById('ip').onclick=()=>{go(cur-1);auto()};document.getElementById('in').onclick=()=>{go(cur+1);auto()};
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(cur+1);auto()}if(e.key==='ArrowLeft'){go(cur-1);auto()}});
  let sx=null;iso.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});iso.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){go(cur+(dx<0?1:-1));auto()}sx=null});
  document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));const sq=b.dataset.r==='square';iso.classList.toggle('square',sq);iso.querySelectorAll('img[data-wide]').forEach(im=>im.src=sq?im.dataset.square:im.dataset.wide)});
  if(frames.length){go(0);auto()}
})();
</script>
