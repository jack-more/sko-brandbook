<meta charset="utf-8"><title>SKO Compounds – Research, refined.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>
:root{--navy:#173384}
*{box-sizing:border-box;margin:0}
body{background:#0d0d0c;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* announcement bar */
.bar{position:relative;z-index:3;height:34px;display:flex;align-items:center;justify-content:center;background:var(--navy);font-size:12px;letter-spacing:.01em}
.bar p{text-decoration:underline;text-underline-offset:3px}
.bar button{position:absolute;top:0;height:34px;width:48px;background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center}
.bar .prev{left:12px}.bar .next{right:12px}
/* hero: full-bleed media, header and copy float over it */
.hero{position:relative;height:calc(100vh - 34px);height:calc(100svh - 34px);min-height:560px;overflow:hidden}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:drift 24s ease-in-out infinite alternate}
/* phones: the still's bottom (placeholder vial) sits under the copy, so crop it off */
@media (max-aspect-ratio:3/4){.media{height:124%;object-position:50% 0}}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09) translateY(-1%)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 58%,rgba(0,0,0,.42) 100%);pointer-events:none}
header{position:absolute;z-index:2;top:0;left:0;right:0;height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(16px,3vw,40px)}
header .l,header .r{display:flex;gap:22px;align-items:center}
header .r{justify-content:flex-end}
header svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.4;display:block}
header img{height:26px;display:block}
.copy{position:absolute;z-index:2;left:0;right:0;bottom:clamp(36px,7vh,72px);text-align:center;padding:0 20px}
.copy h1{font-weight:400;font-size:clamp(21px,2vw,27px);letter-spacing:-.01em;text-transform:uppercase}
.copy p{margin-top:10px;font-size:12px;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.copy a{display:inline-block;margin-top:18px;font-size:13px;text-decoration:underline;text-underline-offset:4px}
</style>

<div class="bar">
  <button class="prev" aria-label="Previous"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#fff" stroke-width="1.4"><path d="M7 1 2 6l5 5"/></svg></button>
  <p id="msg">Beverly Hills based</p>
  <button class="next" aria-label="Next"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#fff" stroke-width="1.4"><path d="m1 1 5 5-5 5"/></svg></button>
</div>

<section class="hero">
  <!-- Swap for the Seedance clip when it lands:
  <video class="media" autoplay muted loop playsinline poster="../img/hero/sophie-bath-916.jpg"><source src="../img/hero/sophie-bath.mp4" type="video/mp4"></video> -->
  <img class="media" src="../img/hero/sophie-bath-916.jpg" alt="">
  <header>
    <div class="l">
      <svg viewBox="0 0 20 20" aria-label="Menu"><path d="M2 6h16M2 10h16M2 14h16"/></svg>
      <svg viewBox="0 0 20 20" aria-label="Search"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 5 5"/></svg>
    </div>
    <a href="https://skocompounds.com"><img src="../img/lockup-3x1-white.png" alt="SKO Compounds"></a>
    <div class="r">
      <svg viewBox="0 0 20 20" aria-label="Account"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
      <svg viewBox="0 0 20 20" aria-label="Bag"><path d="M4 7h12l-1 11H5L4 7Z"/><path d="M7 7V5.5a3 3 0 0 1 6 0V7"/></svg>
    </div>
  </header>
  <div class="copy">
    <h1>Research, refined.</h1>
    <p>Cheap RUOs cost more time and money</p>
    <a id="cta" href="https://skocompounds.com/products?sort=best">Shop best sellers</a>
  </div>
</section>

<script>
// carry lp_code, utm_* etc. through to the store
const q = location.search.slice(1);
if (q) { const a = document.getElementById("cta"); a.href += "&" + q; }
// announcement bar: his four selling points
const M = ["Beverly Hills based", "Fast shipping", "Customer support", "3rd party tested"];
let i = 0;
const show = d => { i = (i + d + M.length) % M.length; document.getElementById("msg").textContent = M[i]; };
document.querySelector(".prev").onclick = () => show(-1);
document.querySelector(".next").onclick = () => show(1);
setInterval(() => show(1), 4000);
</script>
