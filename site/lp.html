<title>SKO Compounds – Research Peptides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="description" content="Third-party tested research peptides. 15% off with code TIKTOK15."><meta property="og:title" content="SKO Compounds – Research Peptides"><meta property="og:description" content="Third-party tested research peptides. 15% off with code TIKTOK15.">
<style>
:root{--navy:#173384;--ink:#020B77;--frost:#88A9E3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--navy);color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.disp{font:700 1em Syncopate,ui-sans-serif,sans-serif;text-transform:uppercase;letter-spacing:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
#stage{position:fixed;inset:0;cursor:pointer;background:var(--navy)}
.frame{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.frame.on{opacity:1}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.frame .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,11,119,.35),transparent 30%,transparent 60%,rgba(2,11,119,.7))}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.14) 50%,transparent 55%);transform:translateX(-130%);pointer-events:none}
.frame.on .sweep{animation:sw 1.6s .2s ease-out forwards}
@keyframes sw{to{transform:translateX(130%)}}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);z-index:3}
.top img{height:24px}
.cap{position:fixed;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:clamp(64px,10vh,110px);z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cap .name{font-size:clamp(20px,3.4vw,52px);line-height:1.02;transform:translateY(20px);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.cap.on .name{transform:none;opacity:1}
.cap .k{color:var(--frost);margin-bottom:8px}
.btn{display:inline-block;background:#fff;color:var(--navy);padding:16px 22px;font:700 11px Syncopate,sans-serif;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.dots{position:fixed;left:0;right:0;bottom:clamp(40px,7vh,80px);display:flex;justify-content:center;gap:5px;z-index:3;padding:0 20px;flex-wrap:wrap}
.dots i{width:14px;height:2px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--ink);color:#fff;text-align:center;padding:10px 16px}
.bar b{font:inherit;color:#fff}
@media (max-width:640px){.cap{flex-direction:column;align-items:flex-start}.cap .btn{width:100%;text-align:center}}
@media (prefers-reduced-motion:reduce){.frame,.cap .name{transition:none}.frame.on .sweep{animation:none}}
/* phones: the 1:1 frame whole under the header, name + button below it */
@media (max-aspect-ratio:1/1){
  .frame img{top:56px;bottom:auto;height:100vw;object-fit:cover}
  .frame .veil{background:linear-gradient(180deg,rgba(2,11,119,.25),transparent 20%,transparent 85%,rgba(2,11,119,.5))}
  .cap{top:calc(56px + 100vw + 22px);bottom:auto;flex-direction:column;align-items:flex-start;gap:18px}
  .cap .name{font-size:30px}
  .cap .btn{width:100%;text-align:center}
  .dots{bottom:auto;top:calc(56px + 100vw - 14px)}
}
</style>
<div id="stage"></div>
<div class="top"><img src="../img/lockup-3x1-white.png" alt="SKO Compounds"><span class="mono">RESEARCH USE ONLY</span></div>
<div class="cap" id="cap"><div><div class="mono k" id="k"></div><div class="disp name" id="name"></div></div><a class="btn" id="add" href="#">Add to cart</a></div>
<div class="dots" id="dots"></div>
<div class="bar mono">CODE <b id="code"></b> APPLIED · <b id="offer"></b></div>
<script>
// the whole page is the funnel. edit these four lines for the next offer.
const CODE='TIKTOK15', OFFER='15% OFF YOUR ORDER';
const BEST='https://skocompounds.com/products?sort=best';   // the page with the top sellers
const CART='https://skocompounds.com/products/';            // product page base; slug appended
const FRAMES=[{"slug": "bpc-157", "name": "BPC-157", "wide": "../img/products/web/bpc-157-wide.jpg", "square": "../img/products/web/bpc-157-square.jpg"}, {"slug": "tb-500", "name": "TB-500", "wide": "../img/products/web/tb-500-wide.jpg", "square": "../img/products/web/tb-500-square.jpg"}, {"slug": "ghk-cu", "name": "GHK-Cu", "wide": "../img/products/web/ghk-cu-wide.jpg", "square": "../img/products/web/ghk-cu-square.jpg"}, {"slug": "nad", "name": "SKO-NAD", "wide": "../img/products/web/nad-wide.jpg", "square": "../img/products/web/nad-square.jpg"}, {"slug": "mt-2", "name": "MT-2", "wide": "../img/products/web/mt-2-wide.jpg", "square": "../img/products/web/mt-2-square.jpg"}, {"slug": "cjc-1295", "name": "CJC 1295 no DAC + Ipamorelin", "wide": "../img/products/web/cjc-1295-wide.jpg", "square": "../img/products/web/cjc-1295-square.jpg"}, {"slug": "semax", "name": "Semax", "wide": "../img/products/web/semax-wide.jpg", "square": "../img/products/web/semax-square.jpg"}, {"slug": "klow", "name": "KLOW", "wide": "../img/products/web/klow-wide.jpg", "square": "../img/products/web/klow-square.jpg"}, {"slug": "igf1-lr3", "name": "IGF1-LR3", "wide": "../img/products/web/igf1-lr3-wide.jpg", "square": "../img/products/web/igf1-lr3-square.jpg"}, {"slug": "glutathione", "name": "Glutathione", "wide": "../img/products/web/glutathione-wide.jpg", "square": "../img/products/web/glutathione-square.jpg"}, {"slug": "tesamorelin", "name": "Tesamorelin", "wide": "../img/products/web/tesamorelin-wide.jpg", "square": "../img/products/web/tesamorelin-square.jpg"}, {"slug": "bac-water", "name": "Bacteriostatic Water", "wide": "../img/products/web/bac-water-wide.jpg", "square": "../img/products/web/bac-water-square.jpg"}];
const q=new URLSearchParams(location.search);q.set('lp_code',CODE);const qs=q.toString();
document.getElementById('code').textContent=CODE;document.getElementById('offer').textContent=OFFER;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),cap=document.getElementById('cap');
const mq=matchMedia('(max-aspect-ratio: 1/1)');const portrait=mq.matches;
mq.addEventListener('change',e=>[...stage.querySelectorAll('img')].forEach((im,i)=>im.src=e.matches?FRAMES[i].square:FRAMES[i].wide));
FRAMES.forEach((f,i)=>{const d=document.createElement('div');d.className='frame';d.innerHTML=`<img src="${portrait?f.square:f.wide}" alt="${f.name}"><div class="veil"></div><div class="sweep"></div>`;stage.appendChild(d);const o=document.createElement('i');dots.appendChild(o)});
const frames=[...stage.children],ds=[...dots.children];let cur=0,timer;
function show(i){cur=(i+frames.length)%frames.length;frames.forEach((f,j)=>f.classList.toggle('on',j===cur));ds.forEach((d,j)=>d.classList.toggle('on',j===cur));cap.classList.remove('on');const f=FRAMES[cur];document.getElementById('k').textContent='0'+(cur+1)+' / '+frames.length;document.getElementById('name').textContent=f.name;document.getElementById('add').href=CART+f.slug+'?'+qs+'&add=1';setTimeout(()=>cap.classList.add('on'),40)}
function auto(){clearInterval(timer);timer=setInterval(()=>show(cur+1),4200)}
show(0);auto();
// a click anywhere that isn't Add to cart goes to the best sellers page with the code
document.addEventListener('click',e=>{if(e.target.closest('#add'))return;location.href=BEST+(BEST.includes('?')?'&':'?')+qs},true);
</script>
