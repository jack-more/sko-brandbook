<title>SKO Compounds – Research Peptides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="description" content="Third-party tested research peptides. 15% off with code TIKTOK15."><meta property="og:title" content="SKO Compounds – Research Peptides"><meta property="og:description" content="Third-party tested research peptides. 15% off with code TIKTOK15.">
<style>
:root{--navy:#173384;--ink:#020B77;--frost:#88A9E3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{cursor:pointer;background:radial-gradient(120% 90% at 50% 110%,#1d3f9c 0%,var(--navy) 45%,var(--ink) 100%)}
.disp{font:700 1em Syncopate,ui-sans-serif,sans-serif;text-transform:uppercase;letter-spacing:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);z-index:3}
.top img{height:24px}
/* the pop-up */
.wrap{position:fixed;inset:0;display:grid;place-items:center;padding:72px 16px 24px}
.pop{position:relative;width:min(92vw,calc((100vh - 250px) * 1.7778),1080px);background:var(--navy);box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(136,169,227,.25);opacity:0;transform:translateY(24px) scale(.94);transition:opacity .7s cubic-bezier(.2,.8,.2,1) .15s,transform .7s cubic-bezier(.2,.8,.2,1) .15s}
.pop.in{opacity:1;transform:none}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--navy)}
.frame{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.frame.on{opacity:1}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.14) 50%,transparent 55%);transform:translateX(-130%);pointer-events:none}
.frame.on .sweep{animation:sw 1.4s .1s ease-out forwards}
@keyframes sw{to{transform:translateX(130%)}}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:5px;z-index:2}
.dots i{width:12px;height:2px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.cap{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px clamp(18px,3vw,36px) 26px;flex-wrap:wrap}
.cap .k{color:var(--frost);margin-bottom:8px}
.cap .k b{color:#fff;font:inherit}
.cap .name{font-size:clamp(18px,2.6vw,34px);line-height:1.04;transform:translateY(14px);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.cap.on .name{transform:none;opacity:1}
.act{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.btn{display:inline-block;background:#fff;color:var(--navy);padding:18px 26px;font:700 11px Syncopate,sans-serif;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.alt{color:var(--frost);text-decoration:none;font-size:12px}
.alt u{text-decoration-color:rgba(136,169,227,.5)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;width:0;background:#fff;transition:width linear}
.foot{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:10px 16px;color:var(--frost);z-index:3}
.foot b{color:#fff;font:inherit}
@media (prefers-reduced-motion:reduce){.pop,.frame,.cap .name{transition:none}.frame.on .sweep{animation:none}.pop{opacity:1;transform:none}}
/* phones: the 1:1 frame whole, caption stacked under it */
@media (max-aspect-ratio:1/1){
  .wrap{padding:64px 12px 40px;align-items:start}
  .pop{width:min(94vw,calc(100vh - 300px))}
  .stage{aspect-ratio:1/1}
  .cap{flex-direction:column;align-items:stretch;padding:18px 18px 24px}
  .cap .name{font-size:24px}
  .act{align-items:stretch;text-align:center}
  .btn{text-align:center}
}
</style>
<div class="top"><img src="../img/lockup-3x1-white.png" alt="SKO Compounds"><span class="mono">RESEARCH USE ONLY</span></div>
<div class="wrap"><div class="pop" id="pop">
  <div class="stage" id="stage"></div><div class="dots" id="dots"></div>
  <div class="cap" id="cap">
    <div><div class="mono k">CODE <b id="code"></b> APPLIED · <b id="offer"></b></div><div class="disp name" id="name"></div></div>
    <div class="act"><a class="btn" id="go" href="#">Shop best sellers</a><a class="alt" id="add" href="#">or add <u id="addname"></u> to cart</a></div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div></div>
<div class="foot mono">Taking you to best sellers in <b id="sec"></b></div>
<script>
// the whole page is the funnel. edit these lines for the next offer.
const CODE='TIKTOK15', OFFER='15% OFF YOUR ORDER';
const BEST='https://skocompounds.com/products?sort=best';   // where everyone ends up
const CART='https://skocompounds.com/products/';            // product page base; slug appended
const HOLD=9;                                               // seconds the pop-up stays before it forwards on its own
const FRAMES=[{"slug": "bpc-157", "name": "BPC-157", "wide": "../img/products/web/bpc-157-wide.jpg", "square": "../img/products/web/bpc-157-square.jpg"}, {"slug": "tb-500", "name": "TB-500", "wide": "../img/products/web/tb-500-wide.jpg", "square": "../img/products/web/tb-500-square.jpg"}, {"slug": "ghk-cu", "name": "GHK-Cu", "wide": "../img/products/web/ghk-cu-wide.jpg", "square": "../img/products/web/ghk-cu-square.jpg"}, {"slug": "nad", "name": "SKO-NAD", "wide": "../img/products/web/nad-wide.jpg", "square": "../img/products/web/nad-square.jpg"}, {"slug": "mt-2", "name": "MT-2", "wide": "../img/products/web/mt-2-wide.jpg", "square": "../img/products/web/mt-2-square.jpg"}, {"slug": "cjc-1295", "name": "CJC 1295 no DAC + Ipamorelin", "wide": "../img/products/web/cjc-1295-wide.jpg", "square": "../img/products/web/cjc-1295-square.jpg"}, {"slug": "semax", "name": "Semax", "wide": "../img/products/web/semax-wide.jpg", "square": "../img/products/web/semax-square.jpg"}, {"slug": "klow", "name": "KLOW", "wide": "../img/products/web/klow-wide.jpg", "square": "../img/products/web/klow-square.jpg"}, {"slug": "igf1-lr3", "name": "IGF1-LR3", "wide": "../img/products/web/igf1-lr3-wide.jpg", "square": "../img/products/web/igf1-lr3-square.jpg"}, {"slug": "glutathione", "name": "Glutathione", "wide": "../img/products/web/glutathione-wide.jpg", "square": "../img/products/web/glutathione-square.jpg"}, {"slug": "tesamorelin", "name": "Tesamorelin", "wide": "../img/products/web/tesamorelin-wide.jpg", "square": "../img/products/web/tesamorelin-square.jpg"}, {"slug": "bac-water", "name": "Bacteriostatic Water", "wide": "../img/products/web/bac-water-wide.jpg", "square": "../img/products/web/bac-water-square.jpg"}];
const q=new URLSearchParams(location.search);q.set('lp_code',CODE);const qs=q.toString();
const BESTURL=BEST+(BEST.includes('?')?'&':'?')+qs;
document.getElementById('code').textContent=CODE;document.getElementById('offer').textContent=OFFER;document.getElementById('go').href=BESTURL;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),cap=document.getElementById('cap');
const mq=matchMedia('(max-aspect-ratio: 1/1)');const portrait=mq.matches;
mq.addEventListener('change',e=>[...stage.querySelectorAll('img')].forEach((im,i)=>im.src=e.matches?FRAMES[i].square:FRAMES[i].wide));
FRAMES.forEach((f,i)=>{const d=document.createElement('div');d.className='frame';d.innerHTML=`<img src="${portrait?f.square:f.wide}" alt="${f.name}"><div class="sweep"></div>`;stage.appendChild(d);const o=document.createElement('i');dots.appendChild(o)});
const frames=[...stage.children],ds=[...dots.children];let cur=0,timer;
function show(i){cur=(i+frames.length)%frames.length;frames.forEach((f,j)=>f.classList.toggle('on',j===cur));ds.forEach((d,j)=>d.classList.toggle('on',j===cur));cap.classList.remove('on');const f=FRAMES[cur];document.getElementById('name').textContent=f.name;document.getElementById('addname').textContent=f.name;document.getElementById('add').href=CART+f.slug+'?'+qs+'&add=1';setTimeout(()=>cap.classList.add('on'),40)}
function auto(){clearInterval(timer);timer=setInterval(()=>show(cur+1),2600)}
show(0);auto();
// pop in, count down, forward
let gone=false;function go(){if(gone)return;gone=true;location.href=BESTURL}
requestAnimationFrame(()=>setTimeout(()=>document.getElementById('pop').classList.add('in'),30));
const prog=document.getElementById('prog'),sec=document.getElementById('sec');let left=HOLD;sec.textContent=left;
setTimeout(()=>{prog.style.transitionDuration=HOLD+'s';prog.style.width='100%'},900);
const tick=setInterval(()=>{left--;sec.textContent=Math.max(left,0);if(left<=0){clearInterval(tick);go()}},1000);
// a click anywhere that isn't the add link forwards now
document.addEventListener('click',e=>{if(e.target.closest('#add'))return;e.preventDefault();go()},true);
</script>
