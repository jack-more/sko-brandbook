<meta charset="utf-8"><title>SKO Compounds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--navy:#173384;--ink:#020B77;--pig:#0130C0;--sky:#0148FE;--frost:#88A9E3;--mute:#5b6789;--line:rgba(2,11,119,.14)}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--navy);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.syn{font-family:Syncopate,sans-serif;font-weight:700;text-transform:uppercase}
a{color:inherit;text-decoration:none}

/* ── hero: one screen, the picture carries it ── */
.hero{position:relative;height:100vh;min-height:640px;overflow:hidden;background:#0b2a63}
.hero iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;z-index:3;pointer-events:none;
  background:linear-gradient(to top,rgba(2,11,60,.62),rgba(2,11,60,.22) 45%,transparent)}
.hero .plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vial{position:absolute;left:50%;transform:translateX(-50%);bottom:23%;height:56%;width:auto;filter:drop-shadow(0 34px 56px rgba(2,11,60,.55));z-index:2}
.nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:22px 34px}
.nav img{height:26px;width:auto}
.nav .lk{display:flex;gap:26px}
.nav .lk a,.nav .cart{color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.86}
.nav .cart{border:1px solid rgba(255,255,255,.45);padding:7px 13px}
.hcopy{position:absolute;left:34px;bottom:126px;z-index:5;color:#fff;max-width:340px}
.hcopy .l1{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px}
.hcopy .l2{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.hstatus{position:absolute;right:34px;bottom:126px;z-index:5;text-align:right;color:rgba(255,255,255,.82);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.8}
.hstatus b{color:#fff;font-weight:500}

/* the buy bar: their CTA slot, doing our job */
.buy{position:absolute;left:34px;right:34px;bottom:34px;z-index:6;background:#fff;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:0}
.buy .sel{display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid var(--line);height:64px}
.buy .sel .mono{color:var(--mute);font-size:10px}
.buy .sel b{font-size:14px;font-weight:600;letter-spacing:.01em}
.buy .sel i{font-style:normal;color:var(--mute);font-size:11px}
.buy .facts{display:flex;align-items:center;gap:18px;padding:0 20px;height:64px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.buy .price{padding:0 22px;height:64px;display:flex;align-items:center;font-size:17px;font-weight:600;border-left:1px solid var(--line)}
.buy .add{background:var(--pig);color:#fff;height:64px;display:flex;align-items:center;padding:0 34px;font-family:Syncopate,sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ── top sellers, straight after ── */
.wrap{max-width:1360px;margin:0 auto;padding:0 34px}
.band{display:flex;align-items:baseline;justify-content:space-between;padding:44px 0 22px}
.band h2{font-family:Syncopate,sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:0}
.band .mono{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding-bottom:44px}
.card{display:block}
.card .im{aspect-ratio:1/1;display:grid;place-items:center;background:#fff}
.card .im img{width:82%;height:82%;object-fit:contain;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .im img{transform:translateY(-8px) scale(1.03)}
.card .nm{font-size:15px;font-weight:600;margin-top:10px}
.card .sp{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.card .pr{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:15px;font-weight:600}
.card .pr span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--pig)}
</style>

<div class="hero">
  <iframe src="https://jackmorello.com/skoembed?c=bpc157&cycle=0&z=1.45&ox=0&spin=0&label=0&t=snow" title="BPC-157, in chrome"></iframe>
  <img class="vial" src="../img/products/web/bpc-157-cut.png" alt="BPC-157">
  <div class="nav">
    <a href="index.html"><img src="../img/lockup-3x1-white.png" alt="SKO Compounds"></a>
    <div class="lk"><a href="#">Compounds</a><a href="#">Bundles</a><a href="#">Build a box</a><a href="#">The Badge</a><a href="#">Lab</a></div>
    <a class="cart" href="#">Cart · 0</a>
  </div>
  <div class="hcopy">
    <div class="l1">Research, refined.</div>
    <div class="l2">99% purity · third-party tested · research use only</div>
  </div>
  <div class="hstatus">In stock · shipped cold<br>from <b>Los Angeles</b><br>Batch <b>2609-A</b></div>
  <div class="buy">
    <div class="sel"><div><div class="mono">Compound</div><b>BPC-157</b></div><i>▾</i></div>
    <div class="facts"><span>Lyophilised vial</span><span>10 mg</span><span>99% purity</span></div>
    <div class="price">$44.00</div>
    <a class="add" href="#">Add to cart</a>
  </div>
</div>

<div class="wrap">
  <div class="band"><h2>Top sellers</h2><span class="mono">All 38 compounds →</span></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const TOP=[['bpc-157','BPC-157','10 mg',44],['tb-500','TB-500','10 mg',49],['ghk-cu','GHK-Cu','50 mg',39],['nad','NAD+','500 mg',69],
           ['semax','Semax','10 mg',54],['glutathione','Glutathione','600 mg',45],['tesamorelin','Tesamorelin','10 mg',79],['mots-c','MOTS-c','10 mg',59]];
document.getElementById('grid').innerHTML=TOP.map(([s,n,d,p])=>`<a class="card" href="#">
  <div class="im"><img src="../img/products/web/${s}-cut.png" alt="${n}"></div>
  <div class="nm">${n}</div><div class="sp">Lyophilised vial · ${d} · 99% purity</div>
  <div class="pr">$${p}.00 <span>Add →</span></div></a>`).join('');
</script>
